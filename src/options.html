<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Context Smart - Options</title>
    <link rel="stylesheet" href="options.css">
  </head>
  <body>
    <header>
      <svg
        class="app-logo"
        xmlns="http://www.w3.org/2000/svg"
        width="32"
        height="32"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path
          d="M16.005 15.108a5.041 6.52 28.25 00-8.008-6.217 5.041 6.52 28.25 008.008 6.217A11.884 7.288-60.76 014.029 7.001"
        />
        <path d="M17 21h.01" />
        <path d="M7 3h.01" />
        <path d="M7.997 8.891a11.885 7.288-60.756 0111.977 8.107" />
        <circle cx="12" cy="12" r="1" fill="currentColor" />
      </svg>
      <h1 data-i18n="extName">Context Smart</h1>
    </header>

    <main>
      <section>
        <div class="section-head">
          <h2 data-i18n="actionsHeading">Actions</h2>
        </div>
        <div id="action-list" class="action-list"></div>
      </section>

      <section>
        <div class="section-head">
          <h2 data-i18n="enginesHeading">Search engines</h2>
          <div class="actions">
            <button id="add-engine" type="button" data-i18n="addEngine">Add engine</button>
            <button id="import-browser-engines" type="button" data-i18n="importFromBrowser">Import from browser</button>
            <button id="refresh-icons" type="button" class="secondary" data-i18n="refreshIcons">Refresh icons</button>
            <button id="restore-defaults" type="button" class="secondary" data-i18n="restoreDefaults">
              Restore defaults
            </button>
          </div>
        </div>
        <p class="hint" id="browser-import-note" data-i18n="importUnavailable" hidden>
          This browser does not let extensions list installed search engines. Add them manually.
        </p>
        <div id="engine-list" class="engine-list"></div>
      </section>

      <section>
        <h2 data-i18n="behaviorHeading">Behavior</h2>
        <div class="settings-grid">
          <label>
            <span data-i18n="actionsPositionLabel">Action group position</span>
            <select id="setting-actions-position">
              <option value="before" data-i18n="actionsBefore">Before search engines</option>
              <option value="after" data-i18n="actionsAfter">After search engines</option>
            </select>
          </label>
          <label>
            <span data-i18n="triggerLabel">Open the menu</span>
            <select id="setting-trigger">
              <option value="mouseup" data-i18n="triggerMouseup">When text is selected</option>
              <option value="alt" data-i18n="triggerAlt">Selection + hold Alt</option>
              <option value="ctrl" data-i18n="triggerCtrl">Selection + hold Ctrl/Cmd</option>
              <option value="shift" data-i18n="triggerShift">Selection + hold Shift</option>
            </select>
          </label>
          <label>
            <span data-i18n="openInLabel">Open results in</span>
            <select id="setting-open-method">
              <option value="newTab" data-i18n="openNewTab">New focused tab</option>
              <option value="backgroundTab" data-i18n="openBackgroundTab">New background tab</option>
              <option value="currentTab" data-i18n="openCurrentTab">Current tab</option>
              <option value="newWindow" data-i18n="openNewWindow">New window</option>
            </select>
          </label>
          <label>
            <span data-i18n="columnsLabel">Columns</span>
            <input id="setting-columns" type="number" min="1" max="12">
          </label>
          <label>
            <span data-i18n="popupSizeLabel">Popup size</span>
            <select id="setting-popup-size">
              <option value="compact" data-i18n="popupSizeCompact">Compact</option>
              <option value="normal" data-i18n="popupSizeNormal">Normal</option>
              <option value="large" data-i18n="popupSizeLarge">Large</option>
              <option value="luxury" data-i18n="popupSizeLuxury">Luxury</option>
            </select>
          </label>
          <label>
            <span data-i18n="popupPositionLabel">Popup position</span>
            <select id="setting-popup-position">
              <option value="below" data-i18n="popupPositionBelow">Below cursor</option>
              <option value="under" data-i18n="popupPositionUnder">Focused on cursor</option>
            </select>
          </label>
          <label>
            <span data-i18n="themeLabel">Theme</span>
            <select id="setting-theme">
              <option value="auto" data-i18n="themeAuto">System</option>
              <option value="light" data-i18n="themeLight">Light</option>
              <option value="dark" data-i18n="themeDark">Dark</option>
            </select>
          </label>
          <label class="checkbox">
            <input id="setting-labels" type="checkbox">
            <span data-i18n="showLabels">Show engine names</span>
          </label>
        </div>
      </section>

      <section>
        <h2 data-i18n="backupHeading">Backup</h2>
        <p class="hint" data-i18n="backupHint">Export or import your full configuration (engines and settings).</p>
        <div class="actions">
          <button id="export-config" type="button" data-i18n="exportConfig">Export settings</button>
          <button id="import-config" type="button" class="secondary" data-i18n="importConfig">Import settings</button>
          <input id="import-config-file" type="file" accept="application/json,.json" hidden>
        </div>
      </section>
    </main>

    <footer>
      <div class="footer-inner">
        <a
          class="repo-link"
          href="https://github.com/dcog989/Context-Smart"
          target="_blank"
          rel="noopener noreferrer"
          data-i18n="repositoryLink"
          >Project on GitHub</a
        >
        <span id="status" role="status"></span>
      </div>
    </footer>

    <template id="action-row-template">
      <article class="action-row">
        <div class="action-main">
          <input type="checkbox" class="action-enabled">
          <span class="action-icon" aria-hidden="true"></span>
          <span class="action-name" data-i18n="actionFallbackName">Action</span>
          <label class="action-template-field" hidden>
            <input
              type="text"
              class="action-template"
              placeholder="https://example.com/lookup/{searchTerms}"
              data-i18n-placeholder="providerTemplatePlaceholder"
              aria-label="Provider template"
              data-i18n-aria-label="providerTemplateLabel"
            >
          </label>
          <div class="row-actions">
            <button type="button" class="move-up" title="Move up" data-i18n-title="moveUp">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m6 14 6-6 6 6" />
              </svg>
            </button>
            <button type="button" class="move-down" title="Move down" data-i18n-title="moveDown">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m6 10 6 6 6-6" />
              </svg>
            </button>
          </div>
        </div>
      </article>
    </template>

    <template id="engine-row-template">
      <article class="engine-row">
        <div class="engine-main">
          <span class="engine-icon" aria-hidden="true"></span>
          <input
            class="engine-name"
            type="text"
            placeholder="Name"
            data-i18n-placeholder="namePlaceholder"
            aria-label="Name"
            data-i18n-aria-label="namePlaceholder"
          >
          <input
            class="engine-template"
            type="text"
            placeholder="https://example.com/search?q={searchTerms}"
            data-i18n-placeholder="templatePlaceholder"
            aria-label="Search template"
            data-i18n-aria-label="templatePlaceholder"
          >
          <input
            class="engine-icon-url"
            type="text"
            placeholder="Icon URL (optional)"
            data-i18n-placeholder="iconUrlPlaceholder"
            aria-label="Icon URL"
            data-i18n-aria-label="iconUrlPlaceholder"
          >
          <div class="row-actions">
            <button type="button" class="move-up" title="Move up" data-i18n-title="moveUp">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m6 14 6-6 6 6" />
              </svg>
            </button>
            <button type="button" class="move-down" title="Move down" data-i18n-title="moveDown">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="m6 10 6 6 6-6" />
              </svg>
            </button>
            <button type="button" class="delete" title="Delete" data-i18n-title="delete">&#10005;</button>
          </div>
        </div>
      </article>
    </template>

    <script src="theme.js"></script>
    <script src="defaultEngines.js"></script>
    <script src="storage.js"></script>
    <script src="icons.js"></script>
    <script src="options.js"></script>
  </body>
</html>
