name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Version mirrors the Biome binary used locally (biome --version).
      - uses: biomejs/setup-biome@v2
        with:
          version: 2.5.14

      - name: Lint and format
        run: biome ci .

      # Pins match the locally installed toolchain (tsc --version, web-ext).
      - name: Type-check
        run: npx --yes -p typescript@7.0.2 tsc --noEmit -p jsconfig.json

      - name: Lint WebExtension
        run: npx --yes web-ext@10.6.0 lint --source-dir src --output text

      - name: Validate manifests and package
        run: ./scripts/package.sh
