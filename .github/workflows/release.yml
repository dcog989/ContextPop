name: Release

on:
  push:
    tags: [v*]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Package extension
        run: ./scripts/package.sh

      # The tag points at the bump commit, so CHANGELOG.md already contains the
      # matching `## vX.Y.Z` section generated by cog.
      - name: Extract release notes
        run: |
          awk -v tag="${GITHUB_REF_NAME}" '
            index($0, "## " tag " ") == 1 { found = 1; print; next }
            found && (/^- - -$/ || /^## /) { exit }
            found { print }
          ' CHANGELOG.md > RELEASE_NOTES.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          props=(--title "${GITHUB_REF_NAME}" --notes-file RELEASE_NOTES.md)
          case "${GITHUB_REF_NAME}" in *-*) props+=(--prerelease) ;; esac
          gh release create "${GITHUB_REF_NAME}" \
            dist/contextpop-firefox.zip \
            "${props[@]}"
